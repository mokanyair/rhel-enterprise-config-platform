---
- name: Enterprise RHEL baseline - standard configuration
  hosts: rhel
  become: true
  gather_facts: true
  serial: "{{ rollout_serial | default('25%') }}"
  any_errors_fatal: true

  pre_tasks:
    - name: Validate target operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "RedHat"
        fail_msg: >-
          {{ inventory_hostname }} is not a supported Red Hat family system.

    - name: Display execution context
      ansible.builtin.debug:
        msg:
          - "Host={{ inventory_hostname }}"
          - "Environment={{ enterprise_environment | default('undefined') }}"
          - "Rollout={{ rollout_serial | default('25%') }}"

  roles:
    - role: package_management
      tags:
        - packages

    - role: user_management
      tags:
        - users

    - role: sudo_management
      tags:
        - sudo

    - role: selinux_baseline
      tags:
        - selinux

    - role: sysctl_management
      tags:
        - sysctl

    - role: monitoring_agent
      tags:
        - monitoring

- name: Enterprise RHEL baseline - SSH hardening
  hosts: rhel
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  roles:
    - role: ssh_hardening
      tags:
        - ssh

- name: Enterprise RHEL baseline - firewall configuration
  hosts: rhel
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  roles:
    - role: firewall_baseline
      tags:
        - firewall
      when: enterprise_manage_firewall | default(false) | bool

- name: Enterprise RHEL baseline - storage configuration
  hosts: rhel
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require explicit storage initialization approval
      ansible.builtin.assert:
        that:
          - enterprise_storage_allow_initialize | default(false) | bool
        fail_msg: >-
          Storage management is enabled but initialization approval
          has not been granted.
      when: enterprise_manage_storage | default(false) | bool

  roles:
    - role: storage_management
      tags:
        - storage
      when: enterprise_manage_storage | default(false) | bool

- name: Enterprise RHEL baseline - time synchronization
  hosts: rhel
  become: true
  gather_facts: true
  serial: "{{ rollout_serial | default('25%') }}"
  any_errors_fatal: true

  vars:
    timesync_ntp_servers: "{{ enterprise_ntp_servers }}"

  roles:
    - role: redhat.rhel_system_roles.timesync
      tags:
        - timesync

- name: Enterprise RHEL baseline - centralized logging server
  hosts: role_logging
  become: true
  gather_facts: true
  any_errors_fatal: true

  roles:
    - role: log_server
      tags:
        - logging

- name: Enterprise RHEL baseline - centralized logging clients
  hosts: rhel:!role_logging
  become: true
  gather_facts: true
  serial: "{{ rollout_serial | default('25%') }}"
  any_errors_fatal: true

  roles:
    - role: log_client
      tags:
        - logging

- name: Enterprise RHEL baseline - final validation
  hosts: rhel
  become: true
  gather_facts: true
  serial: "{{ rollout_serial | default('25%') }}"
  any_errors_fatal: true

  roles:
    - role: baseline_validation
      tags:
        - validation
