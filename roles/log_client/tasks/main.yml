---
- name: Ensure rsyslog is installed
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: Deploy centralized logging configuration
  ansible.builtin.template:
    src: 60-enterprise-forwarding.conf.j2
    dest: /etc/rsyslog.d/60-enterprise-forwarding.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Validate rsyslog configuration
  ansible.builtin.command:
    cmd: rsyslogd -N1
  changed_when: false

- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd_service:
    name: rsyslog
    state: started
    enabled: true
